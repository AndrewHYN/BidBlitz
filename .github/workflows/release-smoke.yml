name: Release Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Exact deployment URL to smoke-test"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Public desktop and mobile release smoke
        run: npx playwright test e2e/release-smoke.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.base_url }}
