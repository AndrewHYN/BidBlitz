name: Manual Vercel Prebuilt Deploy

on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: "Reviewed commit SHA or ref to deploy"
        required: true
        type: string
      target:
        description: "Deployment target"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_udUjK9zSNigqrDngeAo1pBp0
  VERCEL_PROJECT_ID: prj_8OA1C8dJMwxV0gxa2u3ilbvNYwAN
  VERCEL_CLI_VERSION: "59.19.1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: ${{ inputs.target == 'production' && 'production' || 'preview' }}
    steps:
      - name: Check out exact requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.git_ref }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm

      - name: Require deployment credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${VERCEL_TOKEN:-}" || {
            echo "::error::Add repository/environment secret VERCEL_TOKEN before using this workflow."
            exit 1
          }
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Quality gate
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Install pinned Vercel CLI
        run: npm install --global "vercel@${VERCEL_CLI_VERSION}"

      - name: Pull Vercel environment
        run: vercel pull --yes --environment="${{ inputs.target }}"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build with Vercel production settings
        if: inputs.target == 'production'
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build preview
        if: inputs.target == 'preview'
        run: vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy prebuilt preview
        if: inputs.target == 'preview'
        id: preview_deploy
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --yes | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Preview: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Stage prebuilt production without assigning domains
        if: inputs.target == 'production'
        id: production_stage
        shell: bash
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt --prod --skip-domain --yes | tail -n 1)"
          test -n "$url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Staged production candidate: $url"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Install Chromium for staged smoke
        run: npx playwright install --with-deps chromium

      - name: Smoke preview
        if: inputs.target == 'preview'
        run: npx playwright test e2e/release-smoke.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.preview_deploy.outputs.url }}

      - name: Smoke staged production candidate
        if: inputs.target == 'production'
        run: npx playwright test e2e/release-smoke.spec.ts
        env:
          PLAYWRIGHT_BASE_URL: ${{ steps.production_stage.outputs.url }}

      - name: Promotion reminder
        if: inputs.target == 'production'
        run: |
          echo "::notice::Production candidate is staged and smoke-tested, but domains were NOT assigned."
          echo "::notice::Promote only after reviewing the staged deployment URL."
